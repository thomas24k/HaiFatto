name: HaiFatto
options:
  bundleIdPrefix: com.haifatto
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"

targets:
  HaiFatto:
    type: application
    platform: iOS
    sources:
      - path: HaiFatto
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haifatto.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Hai fatto?"
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos to verify task completion"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Save verification photos"
        INFOPLIST_KEY_UIBackgroundModes: "fetch remote-notification"
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: "com.haifatto.taskreset"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: HaiFatto/HaiFatto.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: HaiFatto/HaiFatto.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - "iCloud.com.haifatto.app"
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - "group.com.haifatto.shared"
        com.apple.developer.aps-environment: development
    dependencies:
      - target: HaiFattoWidgetsExtension

  HaiFattoWidgetsExtension:
    type: app-extension
    platform: iOS
    product: HaiFattoWidgets
    sources:
      - path: HaiFattoWidgets
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haifatto.app.widgets
        INFOPLIST_KEY_CFBundleDisplayName: "Hai fatto? Widgets"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: HaiFattoWidgets/HaiFattoWidgets.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: HaiFattoWidgets/HaiFattoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - "group.com.haifatto.shared"
